name: quiz_app
description: A Flutter quiz application with online/offline modes.
publish_to: 'none' # Prevent accidental publishing
version: 1.0.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  uuid: ^4.2.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.2

  # Add any additional packages you need here

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  assets:
    - assets/images/
